<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 读书管理系统</title>
<style>
:root{--accent:#8e44ad;--accent2:#6c3483}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#2c3e50;min-height:100vh}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .logo{font-size:20px;font-weight:700;letter-spacing:1px}
header .actions{display:flex;gap:8px}
header button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
header button:hover{background:rgba(255,255,255,.3)}
.tabs{display:flex;gap:6px;padding:12px 24px 0;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e8ecf1;position:sticky;top:0;z-index:10}
.tabs button{border:none;background:transparent;padding:10px 16px;font-size:14px;color:#6b7686;cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
.tabpane{display:none}
.tabpane.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card .label{font-size:12px;color:#9aa5b1;margin-bottom:6px}
.card .value{font-size:23px;font-weight:700;color:#2c3e50}
.card .sub{font-size:12px;color:#7f8c9b;margin-top:4px}
.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:18px}
.panel h3{font-size:15px;margin-bottom:14px;color:#34495e;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
canvas{width:100%;height:220px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;color:#6b7686;text-align:left;padding:9px 10px;border-bottom:1px solid #e8ecf1;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f4f8}
tr:hover td{background:#fafcff}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.tag.reading{background:#f4ecfb;color:#8e44ad}
.tag.read{background:#e8f8f5;color:#16a085}
.tag.want{background:#eaf2fb;color:#2980b9}
.tag.paused{background:#fef9e7;color:#b7950b}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:9px;cursor:pointer;font-size:13px;transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#eef1f5;color:#34495e}
.btn.danger{background:#fdecea;color:#c0392b}
.btn.sm{padding:4px 10px;font-size:12px}
.fab{position:fixed;right:28px;bottom:28px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50}
.fab:hover{transform:scale(1.08)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;padding:22px;width:min(480px,92vw);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;color:#2c3e50}
.modal.wide{width:min(640px,92vw)}
.form-row{margin-bottom:13px}
.form-row label{display:block;font-size:12px;color:#6b7686;margin-bottom:5px;font-weight:600}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 12px;border:1px solid #dde3ea;border-radius:9px;font-size:14px;outline:none;font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(142,68,173,.12)}
.form-row textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#toast.show{opacity:1}
.empty{text-align:center;color:#b0b8c4;padding:32px 0;font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:7px 10px;border:1px solid #dde3ea;border-radius:8px;font-size:13px;outline:none}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.book{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;gap:12px;transition:.2s;cursor:pointer}
.book:hover{box-shadow:0 6px 18px rgba(0,0,0,.1);transform:translateY(-2px)}
.book .cover{width:46px;height:62px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}
.book .info{flex:1;min-width:0}
.book .info .name{font-size:14px;font-weight:700;color:#2c3e50;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .info .auth{font-size:12px;color:#7f8c9b;margin-bottom:6px}
.book .info .meta{font-size:11px;color:#9aa5b1;display:flex;gap:8px;flex-wrap:wrap}
.stars{color:#f39c12;font-size:13px}
.note-item{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-left:4px solid var(--accent)}
.note-item .nt{font-size:13px;color:#34495e;font-weight:600;margin-bottom:4px}
.note-item .nb{font-size:12.5px;color:#5d6d7e;line-height:1.7;white-space:pre-wrap}
.note-item .nm{font-size:11px;color:#9aa5b1;margin-top:6px}
.progress{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--accent);border-radius:6px}
/* ---------- 优化：深色模式 / 打印 / 返回按钮 ---------- */
header .backBtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:8px;text-decoration:none;font-size:13px;transition:.2s}
header .backBtn:hover{background:rgba(255,255,255,.3)}
body.dark{background:#12181f;color:#d5dce5}
body.dark header{box-shadow:0 2px 8px rgba(0,0,0,.4)}
body.dark .tabs{background:#161d26;border-bottom-color:#1f2a36}
body.dark .tabs button{color:#8b98a9}
body.dark .card,body.dark .panel{background:#1a222c;box-shadow:0 1px 4px rgba(0,0,0,.3)}
body.dark .card .value,body.dark .modal h3{color:#e6ecf3}
body.dark .card .label,body.dark .panel h3{color:#9aa7b8}
body.dark th{background:#1e2833;color:#9aa7b8;border-bottom-color:#273242}
body.dark td{border-bottom-color:#202b37}
body.dark tr:hover td{background:#1d2732}
body.dark .btn.ghost{background:#27333f;color:#d5dce5}
body.dark .form-row input,body.dark .form-row select,body.dark .form-row textarea{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .modal{background:#1a222c}
body.dark .modal-overlay{background:rgba(8,12,18,.6)}
body.dark .filters select,body.dark .filters input,body.dark .filters input::placeholder{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .empty{color:#5c6a7a}
body.dark .progress{background:#27333f}
@media print{header,.tabs,.fab,.backBtn,.themeBtn{display:none!important}main{padding:0}body{background:#fff;color:#000}}
/* ---------- 在线书城 ---------- */
.store-search{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.store-search input{padding:8px 12px;border:1px solid #dde3ea;border-radius:8px;font-size:13px;flex:1;min-width:220px;outline:none}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.store-card{background:#fff;border:1px solid #eef1f5;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px}
.store-card img{height:140px;object-fit:contain;border-radius:8px;background:#f8fafc;margin-bottom:4px}
.store-card .sc-t{font-size:14px;font-weight:700;color:#2c3e50;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.store-card .sc-a{font-size:12px;color:#7f8c9b}
.store-card .sc-m{font-size:11px;color:#b0b8c4}
.store-card .sc-actions{display:flex;gap:6px;margin-top:auto}
.reader{background:#fff;border-radius:14px;width:min(860px,94vw);height:88vh;display:flex;flex-direction:column;overflow:hidden}
.reader-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #eef1f5;flex-wrap:wrap}
.reader-bar b{font-size:14px;color:#2c3e50}
.reader-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.reader-body{flex:1;overflow:auto;padding:26px 34px;font-size:16px;line-height:1.9;color:#34495e;white-space:pre-wrap;background:#fffdf8}
body.dark .store-card{background:#1a222c;border-color:#273242}
body.dark .store-card .sc-t{color:#e6ecf3}
body.dark .store-search input{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .reader{background:#161d26}
body.dark .reader-bar{border-color:#273242}
body.dark .reader-bar b{color:#e6ecf3}
body.dark .reader-body{background:#141a22;color:#c9d4e0}
/* ================= 小说阅读：多源搜索 + 沉浸式阅读器 ================= */
.nl-srcbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:#9aa5b1}
.nl-srcbar .nl-src{padding:2px 9px;border-radius:20px;background:#f1f3f6;color:#7f8c9b;font-size:11px}
.nl-srcbar .nl-src.ok{background:#e8f8f5;color:#16a085}
.nl-srcbar .nl-src.err{background:#fdecea;color:#c0392b}
.nl-srcbar .nl-src.busy{background:#fef9e7;color:#b7950b}
.nl-card{background:#fff;border:1px solid #eef1f5;border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px;transition:.2s}
.nl-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.1);transform:translateY(-2px)}
.nl-card .nc-top{display:flex;gap:10px}
.nl-card .nc-cv{width:52px;height:70px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0;background:linear-gradient(150deg,#8e44ad,#6c3483)}
.nl-card .nc-info{flex:1;min-width:0}
.nl-card .nc-name{font-size:14px;font-weight:700;color:#2c3e50;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl-card .nc-auth{font-size:12px;color:#7f8c9b;margin-top:2px}
.nl-card .nc-meta{font-size:11px;color:#b0b8c4;display:flex;gap:6px;flex-wrap:wrap}
.nl-card .nc-desc{font-size:12px;color:#5d6d7e;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl-card .nc-actions{display:flex;gap:6px;margin-top:auto}
.nl-tag{display:inline-block;padding:1px 8px;border-radius:12px;font-size:10px;background:#eaf2fb;color:#2980b9}
.nl-local-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.nl-local-item .li-info{flex:1;min-width:0}
.nl-local-item .li-name{font-size:14px;font-weight:700;color:#2c3e50}
.nl-local-item .li-sub{font-size:12px;color:#9aa5b1;margin-top:2px}
body.dark .nl-card{background:#1a222c;border-color:#273242}
body.dark .nl-card .nc-name{color:#e6ecf3}
body.dark .nl-card .nc-desc{color:#9aa7b8}
body.dark .nl-srcbar .nl-src{background:#27333f;color:#9aa7b8}
body.dark .nl-local-item{background:#1a222c}
/* ---- 沉浸式阅读器 ---- */
.nr-overlay{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:#fffdf8;color:#1a1a1a}
.nr-overlay[data-bg="sepia"]{background:#f5ecd9;color:#5b4636}
.nr-overlay[data-bg="green"]{background:#dcefe0;color:#3e4a3d}
.nr-overlay[data-bg="dark"]{background:#17171a;color:#b8b8b8}
.nr-overlay[data-bg="blue"]{background:#1c2735;color:#c8d3e0}
.nr-top{display:flex;align-items:center;gap:4px;padding:0 10px;height:48px;border-bottom:1px solid rgba(128,128,128,.18);flex-shrink:0}
.nr-overlay[data-bg="dark"] .nr-top,.nr-overlay[data-bg="blue"] .nr-top{border-bottom-color:rgba(255,255,255,.12)}
.nr-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600;padding:0 8px}
.nr-btn{border:none;background:transparent;cursor:pointer;padding:6px 9px;border-radius:8px;font-size:13px;opacity:.72;color:inherit;white-space:nowrap}
.nr-btn:hover{opacity:1;background:rgba(128,128,128,.14)}
.nr-wrap{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}
.nr-body{flex:1;overflow-y:auto;padding:28px 22px 80px;white-space:pre-wrap;word-break:break-word;line-height:1.9;font-size:17px;outline:none;transition:background .2s}
.nr-body .nr-ct{font-size:1.18em;font-weight:700;text-align:center;margin:8px 0 1.6em;line-height:1.6}
.nr-zone{position:absolute;top:48px;bottom:44px;width:18%;cursor:pointer;z-index:6;opacity:0}
.nr-zone.prev{left:0}.nr-zone.next{right:0}
.nr-bottom{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border-top:1px solid rgba(128,128,128,.18);flex-shrink:0;font-size:12px}
.nr-overlay[data-bg="dark"] .nr-bottom,.nr-overlay[data-bg="blue"] .nr-bottom{border-top-color:rgba(255,255,255,.12)}
.nr-bottom input[type=range]{flex:1;accent-color:#8e44ad}
.nr-bottom .nr-pos{min-width:76px;text-align:center;opacity:.75}
.nr-drawer{position:fixed;top:48px;bottom:0;width:min(330px,88vw);background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.18);z-index:310;display:flex;flex-direction:column;transition:transform .22s ease;right:0}
.nr-drawer.left{right:auto;left:0;box-shadow:6px 0 24px rgba(0,0,0,.18)}
.nr-drawer.hide{transform:translateX(106%)}
.nr-drawer.left.hide{transform:translateX(-106%)}
.nr-drawer>h4{padding:13px 16px;border-bottom:1px solid #eef1f5;font-size:14px;color:#34495e;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.nr-drawer>h4 .x{cursor:pointer;opacity:.5;font-weight:400}
.nr-dlist{flex:1;overflow-y:auto;padding:8px}
.nr-ditem{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.5;color:#34495e}
.nr-ditem:hover{background:#f4f6f9}
.nr-ditem.cur{background:#f4ecfb;color:#8e44ad;font-weight:600}
.nr-ditem .mk-sub{font-size:11px;color:#9aa5b1;margin-top:2px}
.nr-ditem .mk-del{float:right;opacity:.45;font-size:12px}
.nr-ditem .mk-del:hover{opacity:1;color:#c0392b}
.nr-set{padding:12px 16px;border-bottom:1px solid #f1f4f8}
.nr-set label{font-size:12px;color:#7f8c9b;display:block;margin-bottom:7px}
.nr-set input[type=range]{width:100%;accent-color:#8e44ad}
.nr-set select{width:100%;padding:7px 10px;border:1px solid #dde3ea;border-radius:8px;font-size:13px;outline:none}
.nr-colors{display:flex;gap:8px;flex-wrap:wrap}
.nr-color{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:13px}
.nr-color.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px #8e44ad}
.nr-bg{width:56px;height:44px;border-radius:10px;cursor:pointer;border:2px solid rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px}
.nr-bg.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px #8e44ad}
.nr-bg i{width:26px;height:4px;border-radius:2px;background:rgba(0,0,0,.25)}
.nr-loading{padding:60px 0;text-align:center;color:#9aa5b1;font-size:13px}
.nr-loading .spin{display:inline-block;width:26px;height:26px;border:3px solid #eef1f5;border-top-color:#8e44ad;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.nr-end{text-align:center;color:#9aa5b1;font-size:13px;padding:26px 0 10px}
.nr-addmark{position:fixed;right:14px;bottom:56px;z-index:305;width:42px;height:42px;border-radius:50%;border:none;background:#8e44ad;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.nr-addmark:hover{transform:scale(1.08)}
body.dark .nr-drawer{background:#1a222c}
body.dark .nr-drawer>h4{border-bottom-color:#273242;color:#d5dce5}
body.dark .nr-ditem{color:#c9d4e0}
body.dark .nr-ditem:hover{background:#222d39}
body.dark .nr-set{border-bottom-color:#202b37}
body.dark .nr-set label{color:#9aa7b8}
body.dark .nr-set select{background:#151c25;border-color:#2a3644;color:#d5dce5}
</style>
</head>
<body>
<header>
  <div class="logo">📚 读书管理系统</div>
  <div class="actions">
    <a href="index.html" class="backBtn">🏠 总览</a>
    <button onclick="toggleTheme()" class="themeBtn">🌙</button>
    <button onclick="loadExample()">✨ 示例</button>
    <button onclick="exportData()">📤 导出</button>
    <button onclick="document.getElementById('file').click()">📥 导入</button>
    <input type="file" id="file" accept=".json" class="hidden" onchange="importData(this)">
  </div>
</header>
<nav class="tabs">
  <button class="active" data-tab="dash" onclick="switchTab('dash')">仪表盘</button>
  <button data-tab="shelf" onclick="switchTab('shelf')">我的书架</button>
  <button data-tab="reading" onclick="switchTab('reading')">阅读打卡</button>
  <button data-tab="notes" onclick="switchTab('notes')">读书笔记</button>
  <button data-tab="stats" onclick="switchTab('stats')">年度统计</button>
  <button data-tab="novel" onclick="switchTab('novel')">📖 小说阅读</button>
  <button data-tab="store" onclick="switchTab('store')">📚 在线书城</button>
</nav>
<main>
  <section id="tab-dash" class="tabpane active">
    <div class="cards" id="dashCards"></div>
    <div class="grid2">
      <div class="panel"><h3>本月每日阅读时长</h3><canvas id="chartMonth"></canvas></div>
      <div class="panel"><h3>阅读类型分布（本年度）</h3><canvas id="chartCat"></canvas></div>
    </div>
    <div class="panel"><h3>最近读书笔记</h3><div id="recentNotes"></div></div>
  </section>
  <section id="tab-shelf" class="tabpane">
    <div class="panel">
      <div class="filters">
        <select id="fStatus" onchange="renderShelf()"><option value="">全部状态</option><option value="reading">在读</option><option value="read">已读完</option><option value="want">想读</option><option value="paused">暂停</option></select>
        <select id="fCat" onchange="renderShelf()"><option value="">全部分类</option></select>
        <input type="text" id="fSearch" placeholder="搜索书名 / 作者…" oninput="renderShelf()" style="flex:1;min-width:140px">
      </div>
      <div class="book-grid" id="shelfGrid"></div>
    </div>
  </section>
  <section id="tab-reading" class="tabpane">
    <div class="cards" id="readCards"></div>
    <div class="panel">
      <h3>阅读打卡记录<button class="btn sm" onclick="openLog()">＋ 记录阅读</button></h3>
      <table id="logTable"></table>
    </div>
  </section>
  <section id="tab-notes" class="tabpane">
    <div class="panel">
      <h3>全部读书笔记<button class="btn sm" onclick="openNote()">＋ 写笔记</button></h3>
      <div id="noteList"></div>
    </div>
  </section>

        <option value="system">系统默认</option><option value="serif">宋体 / 衬线</option><option value="kaiti">楷体</option>
        <option value="heiti">黑体</option><option value="fangsong">仿宋</option><option value="mono">等宽</option></select></div>

<div id="toast"></div>
<script>
const KEY='reading_sys_v1';
let db=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{books:[],logs:[],notes:[]}}catch(e){return{books:[],logs:[],notes:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');document.querySelectorAll('.themeBtn').forEach(b=>b.textContent=t==='dark'?'☀️':'🌙')}
function toggleTheme(){const t=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('theme',t);applyTheme(t)}
applyTheme(localStorage.getItem('theme')||'light');
function loadExample(){
  if(!confirm('将用示例数据覆盖当前数据，确定？'))return;
  const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');
  const day=n=>y+'-'+m+'-'+String(n).padStart(2,'0');
  const b1=uid(),b2=uid(),b3=uid(),b4=uid();
  db.books=[
    {id:b1,name:'深入理解计算机系统',author:'Randal E. Bryant',cat:'计算机',status:'reading',progress:62,pages:752,color:'#2980b9',rating:0},
    {id:b2,name:'活着',author:'余华',cat:'文学',status:'read',progress:100,pages:191,color:'#c0392b',rating:9},
    {id:b3,name:'被讨厌的勇气',author:'岸见一郎',cat:'心理',status:'reading',progress:35,pages:194,color:'#8e44ad',rating:0},
    {id:b4,name:'原则',author:'瑞·达利欧',cat:'商业',status:'want',progress:0,pages:576,color:'#16a085',rating:0}
  ];
  db.logs=[
    {id:uid(),book:b1,date:day(2),minutes:60,pages:32,note:'第3章 程序的机器级表示'},
    {id:uid(),book:b3,date:day(4),minutes:45,pages:22,note:'课题分离'},
    {id:uid(),book:b1,date:day(6),minutes:90,pages:48,note:'处理器流水线'},
    {id:uid(),book:b2,date:day(8),minutes:120,pages:191,note:'一口气读完，震撼'},
    {id:uid(),book:b3,date:day(10),minutes:40,pages:18,note:'活在当下'}
  ];
  db.notes=[
    {id:uid(),book:b1,title:'流水线冒险',body:'数据冒险可以用转发解决，控制冒险用分支预测。关键是把关键路径想清楚。',date:day(6)},
    {id:uid(),book:b3,title:'课题分离',body:'把别人的课题和我的课题分开，烦恼就会消失大半。',date:day(4)}
  ];
  save();renderDash();toast('已载入示例数据 ✨');
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function bookName(id){const b=db.books.find(x=>x.id===id);return b?b.name:'（已删除书籍）'}
const statusMap={reading:['在读','reading'],read:['已读完','read'],want:['想读','want'],paused:['暂停','paused']};
const coverColors=['#8e44ad','#2980b9','#16a085','#e67e22','#c0392b','#34495e','#27ae60','#d35400'];

function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));
  if(name==='dash')renderDash();
  if(name==='shelf')renderShelf();
  if(name==='reading'){renderReadCards();renderLogs()}
  if(name==='notes')renderNotes();
  if(name==='stats')renderStats();
  if(name==='store'){renderStore()}
  if(name==='novel'){renderNovelLocal();renderSrcBar()}
}
function closeModal(id){document.getElementById(id).classList.add('hidden')}

/* ===== 书架 ===== */
function openBook(id){
  const b=id?db.books.find(x=>x.id===id):null;
  document.getElementById('bookTitle').textContent=b?'编辑书籍':'添加书籍';
  document.getElementById('bkName').value=b?b.name:'';
  document.getElementById('bkAuthor').value=b?(b.author||''):'';
  document.getElementById('bkCat').value=b?(b.cat||'文学'):'文学';
  document.getElementById('bkStatus').value=b?b.status:'want';
  document.getElementById('bkProgress').value=b?(b.progress||0):0;
  document.getElementById('progVal').textContent=(b?(b.progress||0):0)+'%';
  document.getElementById('bkPages').value=b?(b.pages||''):'';
  document.getElementById('bkColor').value=b?(b.color||coverColors[0]):coverColors[0];
  toggleBkProgress();
  document.getElementById('bkName').dataset.editId=id||'';
  document.getElementById('modalBook').classList.remove('hidden');
}
function toggleBkProgress(){document.getElementById('rowProgress').style.display=document.getElementById('bkStatus').value==='read'?'none':''}
function saveBook(){
  const name=document.getElementById('bkName').value.trim();
  if(!name){toast('请输入书名');return}
  const editId=document.getElementById('bkName').dataset.editId;
  const data={
    name,
    author:document.getElementById('bkAuthor').value.trim(),
    cat:document.getElementById('bkCat').value,
    status:document.getElementById('bkStatus').value,
    progress:+document.getElementById('bkProgress').value||0,
    pages:document.getElementById('bkPages').value?+document.getElementById('bkPages').value:null,
    color:document.getElementById('bkColor').value,
    rating:0
  };
  if(editId){const b=db.books.find(x=>x.id===editId);Object.assign(b,data);b.rating=b.rating||0;toast('已保存')}
  else{db.books.push({id:uid(),...data,rating:0});toast('已添加')}
  save();closeModal('modalBook');renderShelf();renderDash();toast(editId?'已保存':'已添加');
}
function delBook(id){if(confirm('删除这本书？相关阅读记录与笔记将一并删除')){db.books=db.books.filter(b=>b.id!==id);db.logs=db.logs.filter(l=>l.book!==id);db.notes=db.notes.filter(n=>n.book!==id);save();renderShelf();renderDash();toast('已删除')}}
function setStatus(id,st){const b=db.books.find(x=>x.id===id);if(!b)return;b.status=st;if(st==='read')b.progress=100;save();renderShelf();renderDash()}
function rateBook(id,r){const b=db.books.find(x=>x.id===id);b.rating=r;save();renderShelf()}
function renderShelf(){
  const st=document.getElementById('fStatus').value,ca=document.getElementById('fCat').value,s=document.getElementById('fSearch').value.trim();
  const catSel=document.getElementById('fCat');
  if(!catSel.dataset.inited){const cats=[...new Set(db.books.map(b=>b.cat))];cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o)});catSel.dataset.inited='1'}
  let list=db.books.filter(b=>(!st||b.status===st)&&(!ca||b.cat===ca)&&(!s||b.name.toLowerCase().includes(s.toLowerCase())||(b.author||'').toLowerCase().includes(s.toLowerCase())));
  const g=document.getElementById('shelfGrid');
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">书架空空如也，点击右下角 ＋ 添加第一本书</div>';return}
  g.innerHTML=list.map(b=>{
    const [stText,stCls]=statusMap[b.status];
    const prog=b.status==='read'?100:(b.progress||0);
    const stars='★★★★★'.slice(0,5).split('').map((c,i)=>`<span style="cursor:pointer" onclick="rateBook('${b.id}',${i+1})">${i<b.rating?c:c.replace('★','☆')}</span>`).join('');
    return `<div class="book" onclick="openBook('${b.id}')">
      <div class="cover" style="background:${b.color}">📖</div>
      <div class="info">
        <div class="name">${esc(b.name)}</div>
        <div class="auth">${esc(b.author)||'佚名'} · ${b.cat}</div>
        <div class="meta"><span class="tag ${stCls}">${stText}</span>${b.pages?'<span>'+b.pages+'页</span>':''}<span class="stars" onclick="event.stopPropagation()">${stars}</span></div>
        <div class="progress"><div style="width:${prog}%"></div></div>
        ${b.novel?`<div style="margin-top:7px;display:flex;gap:6px"><button class="btn sm" style="padding:3px 12px" onclick="event.stopPropagation();openShelfNovel('${b.id}')">▶ 阅读</button></div>`:''}
      </div>
    </div>`;
  }).join('');
}

/* ===== 阅读打卡 ===== */
function openLog(){
  const sel=document.getElementById('lgBook');
  sel.innerHTML='';
  const reading=db.books.filter(b=>b.status==='reading'||b.status==='want'||b.status==='paused');
  const pool=reading.length?reading:db.books;
  if(!pool.length){toast('请先在书架添加书籍');return}
  pool.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name;sel.appendChild(o)});
  document.getElementById('lgDate').value=today();
  document.getElementById('lgMinutes').value=30;
  document.getElementById('lgPages').value='';
  document.getElementById('lgNote').value='';
  document.getElementById('modalLog').classList.remove('hidden');
}
function saveLog(){
  const book=document.getElementById('lgBook').value;
  if(!book){toast('请选择书籍');return}
  const mins=+document.getElementById('lgMinutes').value||0;
  if(!mins){toast('请输入阅读时长');return}
  db.logs.push({id:uid(),book,date:document.getElementById('lgDate').value||today(),minutes:mins,pages:document.getElementById('lgPages').value?+document.getElementById('lgPages').value:null,note:document.getElementById('lgNote').value.trim()});
  const b=db.books.find(x=>x.id===book);
  if(b&&b.status==='want'){b.status='reading'}
  save();closeModal('modalLog');renderReadCards();renderLogs();renderDash();toast('打卡成功 📖');
}
function delLog(id){db.logs=db.logs.filter(l=>l.id!==id);save();renderReadCards();renderLogs();renderDash()}
function renderReadCards(){
  const ym=today().slice(0,7);
  const monthLogs=db.logs.filter(l=>l.date.startsWith(ym));
  const totalMin=monthLogs.reduce((s,l)=>s+l.minutes,0);
  const totalPages=monthLogs.reduce((s,l)=>s+(l.pages||0),0);
  const days=new Set(monthLogs.map(l=>l.date)).size;
  const streak=calcStreak();
  document.getElementById('readCards').innerHTML=`
    <div class="card"><div class="label">本月阅读</div><div class="value">${totalMin} 分钟</div><div class="sub">${ym} · ${days} 天</div></div>
    <div class="card"><div class="label">本月阅读页数</div><div class="value">${totalPages} 页</div><div class="sub">共 ${monthLogs.length} 次打卡</div></div>
    <div class="card"><div class="label">连续阅读</div><div class="value">${streak} 天</div><div class="sub">🔥 保持住！</div></div>
    <div class="card"><div class="label">全年阅读</div><div class="value">${db.logs.reduce((s,l)=>s+l.minutes,0)} 分钟</div><div class="sub">${db.logs.length} 次打卡</div></div>`;
}
function calcStreak(){
  const days=[...new Set(db.logs.map(l=>l.date))].sort().reverse();
  let streak=0,cur=new Date(today()+'T00:00:00');
  if(!days.includes(today()))cur.setDate(cur.getDate()-1);
  while(days.includes(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'))){
    streak++;cur.setDate(cur.getDate()-1);
  }
  return streak;
}
function renderLogs(){
  const list=[...db.logs].sort((a,b)=>a.date<b.date?1:-1);
  const tb=document.getElementById('logTable');
  if(!list.length){tb.innerHTML='<tr><td class="empty" colspan="5">还没有阅读记录，点击「记录阅读」开始</td></tr>';return}

/* ===== 图表 ===== */
function prepCanvas(id){const cv=document.getElementById(id);const dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);return{ctx,w:r.width,h:r.height}}
function drawBar(id,labels,values,color){
  const {ctx,w,h}=prepCanvas(id);
  if(!values.some(v=>v>0)){ctx.fillStyle='#b0b8c4';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无数据',w/2,h/2);return}
  const pad={l:40,r:10,t:14,b:26};
  const mx=Math.max(...values,1);
  const step=(w-pad.l-pad.r)/values.length;
  const bw=Math.min(30,step*0.6);
  ctx.strokeStyle='#eef1f5';ctx.lineWidth=1;ctx.font='10px sans-serif';ctx.fillStyle='#9aa5b1';
  for(let i=0;i<=3;i++){const y=pad.t+i*(h-pad.t-pad.b)/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(Math.round(mx*(1-i/3)),pad.l-6,y+3)}
  values.forEach((v,i)=>{
    if(!v)return;
    const x=pad.l+step*i+(step-bw)/2,bh=(v/mx)*(h-pad.t-pad.b);
    ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,h-pad.b-bh,bw,bh,4);ctx.fill();
  });
  ctx.fillStyle='#6b7686';ctx.font='10px sans-serif';ctx.textAlign='center';
  const showEvery=Math.ceil(labels.length/12);
  labels.forEach((l,i)=>{if(i%showEvery===0||i===labels.length-1)ctx.fillText(l,pad.l+step*i+step/2,h-8)});
}
function drawDonut(id,mapObj){
  const {ctx,w,h}=prepCanvas(id);
  const entries=Object.entries(mapObj);
  if(!entries.length){ctx.fillStyle='#b0b8c4';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无数据',w/2,h/2);return}
  const total=entries.reduce((s,e)=>s+e[1],0);
  const cx=w/2-50,cy=h/2,r=Math.min(w,h)/2-16;
  const palette=['#8e44ad','#2980b9','#16a085','#e67e22','#c0392b','#f39c12','#27ae60','#34495e','#d35400','#7f8c8d'];
  let start=-Math.PI/2;
  entries.forEach((e,i)=>{
    const ang=e[1]/total*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+ang);ctx.closePath();
    ctx.fillStyle=palette[i%palette.length];ctx.fill();
    start+=ang;
  });
  ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#34495e';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  ctx.fillText(total+' 本',cx,cy+5);
  let ly=14;
  ctx.font='12px sans-serif';ctx.textAlign='left';
  entries.slice(0,7).forEach((e,i)=>{
    ctx.fillStyle=palette[i%palette.length];ctx.fillRect(w-150,ly-9,10,10);
    ctx.fillStyle='#5d6d7e';ctx.fillText(e[0]+' '+e[1],w-134,ly);
    ly+=20;
  });
}

async function openReader(id){
  const gb=storeResults.find(b=>b.id===id);if(!gb)return;
  const txtUrl=gb.formats['text/plain; charset=utf-8']||gb.formats['text/plain; charset=us-ascii'];
  if(!txtUrl){toast('该书暂无可在线阅读文本');return}
  document.getElementById('readerModal').classList.remove('hidden');
  document.getElementById('readerTitle').textContent=gb.title+'（古登堡计划）';
  document.getElementById('readerBody').textContent='正在加载全文…';
  try{
    const r=await fetch(txtUrl);
    if(!r.ok)throw 0;
    let txt=await r.text();
    const sm=txt.search(/\*\*\* START OF (THE|THIS) PROJECT GUTENBERG/i);
    const em=txt.search(/\*\*\* END OF (THE|THIS) PROJECT GUTENBERG/i);
    if(sm>=0)txt=txt.slice(sm);
    if(em>sm)txt=txt.slice(0,em);
    readerText=txt.replace(/\r/g,'');readerPage=0;
    renderReaderPage();
  }catch(e){document.getElementById('readerBody').textContent='全文加载失败（网络可能受限）。可尝试在新标签页打开：\n'+txtUrl}
}
function renderReaderPage(){
  const body=document.getElementById('readerBody');
  const chunk=9000,start=readerPage*chunk,end=Math.min(readerText.length,(readerPage+1)*chunk);
  body.textContent=readerText.slice(start,end);
  body.style.fontSize=readerFont+'px';
  document.getElementById('readerFontVal').textContent=readerFont+'px';
  document.getElementById('readerInfo').textContent=(readerPage+1)+' / '+Math.max(1,Math.ceil(readerText.length/chunk))+' 页';
  document.getElementById('readerPrev').disabled=readerPage===0;
  document.getElementById('readerNext').disabled=end>=readerText.length;
}
function readerFontUp(){readerFont=Math.min(28,readerFont+2);renderReaderPage()}
function readerFontDown(){readerFont=Math.max(12,readerFont-2);renderReaderPage()}

        const buf=await r.arrayBuffer();
        if(p&&p.json){const j=JSON.parse(decodeBuf(buf,'utf-8'));if(j&&j.contents!==undefined)return j.contents;throw 0}
        const txt=decodeBuf(buf,charset);
        if(txt&&txt.trim().length>80)return txt;

    }
  }
  throw new Error('通道失败');

function cleanTxt(s){return String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&ldquo;/g,'“').replace(/&rdquo;/g,'”').replace(/&mdash;/g,'—').replace(/&hellip;/g,'…').trim()}

/* ---- 搜索解析 ---- */
function parseSearch(html,src){
  const items=[],chapFallback=[],seen=new Set();
  const re=/<a[^>]+href=["']([^"']+)["'][^>]*>([^<]{2,42})<\/a>/g;let m;
  while((m=re.exec(html))){
    const href=m[1].trim(),text=cleanTxt(m[2]);
    if(text.length<2||text.length>40)continue;
    const isDir=/\/\d+\/$/.test(href);                                     /* 目录链接 /b/0/143/ */
    const isChap=/\.html$/i.test(href)&&/(\/b\/|\/book\/)\d+\/\d+\.html/i.test(href); /* 章节链接 */
    if(!isDir&&!isChap)continue;
    if(/首页|分类|排行|书架|登录|注册|加入书|开始阅读|直达|返回|上一页|下一页|推荐|玄幻|都市|科幻|历史|网游|武侠|全部|完本/.test(text)&&!isDir)continue;
    const text2=text.replace(/^\[[^\]]{2,10}\]/,'').trim();
    if(text2.length<2||seen.has(text2))continue;seen.add(text2);
    if(isDir)items.push({title:text2,url:absUrl(href,'https://'+src.host+'/'),src:src.id,chapUrl:''});
    else chapFallback.push({href,text2});
    if(items.length>=20)break;
  }
  if(!items.length){ /* 兜底：搜索结果只有章节链接时，从章节 URL 推导目录 */
    for(const f of chapFallback.slice(0,10)){
      const dir=f.href.replace(/[^/]+\.html$/,'');
      items.push({title:f.text2.slice(0,20),url:absUrl(dir,'https://'+src.host+'/'),src:src.id,chapUrl:absUrl(f.href,'https://'+src.host+'/')});
    }
  }
  const am=html.match(/作者[:：]\s*([^<\s,，。]{2,14})/);
  items.forEach(it=>it.author=am?am[1]:'');
  return items;
}
function parseToc(html,src,baseUrl){
  const chaps=[],seen=new Set();
  const re=/<a[^>]+href=["']([^"']+)["'][^>]*>([^<]{1,60})<\/a>/g;let m;
  while((m=re.exec(html))){
    const text=cleanTxt(m[2]);
    if(text.length<1||text.length>60)continue;
    if(!/第[零一二三四五六七八九十百千万0-9０-９〇两]{1,12}[章节卷回部集篇]/.test(text)&&!/^(序章|楔子|引子|前言|后记|尾声|终章|番外)/.test(text))continue;
    if(seen.has(text))continue;seen.add(text);
    chaps.push({t:text,u:absUrl(m[1].trim(),baseUrl)});
    if(chaps.length>=2000)break;
  }
  return chaps;
}
function parseContent(html,src){
  const doc=new DOMParser().parseFromString(html,'text/html');
  let node=null;
  for(const sel of src.contentSel.split(',')){
    const el=doc.querySelector(sel.trim());if(el&&el.textContent.trim().length>50){node=el;break}
  }
  let txt;
  if(node)txt=node.innerHTML;
  else{
    const blocks=[];
    doc.querySelectorAll('div,p,article').forEach(el=>{const t=el.textContent.trim();if(t.length>80)blocks.push([t.length,t])});
    blocks.sort((a,b)=>b[0]-a[0]);
    txt=blocks.length?blocks[0][1]:(doc.body?doc.body.textContent:'');
  }
  txt=txt.replace(/<br\s*\/?>/gi,'\n').replace(/<p[^>]*>/gi,'\n').replace(/<\/p>/gi,'\n')
    .replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<!--[\s\S]*?-->/g,'')
    .replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&ldquo;/g,'“').replace(/&rdquo;/g,'”');
  return txt.split('\n').map(s=>s.replace(/\s+/g,' ').trim())
    .filter(s=>s&&!/^(请收藏|章节错误|最快更新|天才一秒|本站新域名|加入书签|推荐票|月票|最新章节|手机用户|一秒记住|顶点小说|笔趣阁手机版|www\.|error|function\s*\(|var\s+\w+=|第\s*\(?\s*\d+\s*\/?\s*\d+\s*\)?\s*页)/.test(s)).join('\n');
}

function splitChapters(text,name){
  text=text.replace(/\r/g,'').replace(/^\uFEFF/,'');
  const re=/^\s*(第[零一二三四五六七八九十百千万0-9０-９〇两]+[章节卷回部集篇][^\n]{0,40}|序章|楔子|引子|前言|后记|尾声|终章|番外[^\n]{0,20})\s*$/gm;
  const idx=[];let m;
  while((m=re.exec(text)))idx.push({i:m.index,t:m[0].trim()});
  if(!idx.length){const c=text.trim();return c?[{t:'全文',c}]:[]}
  const chaps=[];
  for(let k=0;k<idx.length;k++){
    const start=idx[k].i,end=k<idx.length-1?idx[k+1].i:text.length;
    const body=text.slice(start,end).trim();
    if(body)chaps.push({t:idx[k].t,c:body});
  }
  return chaps;
}
function importTxtBook(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let text;
    try{text=new TextDecoder('utf-8').decode(r.result)}catch(e){}
    const bad=(text.match(/\uFFFD/g)||[]).length;
    if(!/[\u4e00-\u9fa5]/.test(text.slice(0,300))||bad>text.length*0.02){
      try{text=new TextDecoder('gb18030').decode(r.result)}catch(e){}
    }
    const chaps=splitChapters(text,f.name);
    if(!chaps.length){toast('无法识别章节，文件可能为空');return}
    const book={id:uid(),name:f.name.replace(/\.(txt|text|utf8)$/i,''),author:'本地导入',local:true,chapters:chaps,time:Date.now()};

function cacheSet(k,v){try{
  let c=JSON.parse(localStorage.getItem(NL_LS.cache)||'{}');c[k]=v;
  const keys=Object.keys(c);let total=0;keys.forEach(x=>total+=JSON.stringify(c[x]).length);
  while(total>1500000&&keys.length>20){const old=keys.shift();total-=JSON.stringify(c[old]).length;delete c[old]}
  localStorage.setItem(NL_LS.cache,JSON.stringify(c));
}catch(e){}}
async function nrLoadChapter(idx){
  if(!NR||idx<0||idx>=NR.chapters.length)return;
  NR.cur=idx;saveProgress();updateNrTitle();renderToc();
  const ch=NR.chapters[idx];
  const ck=NR.src?NR.src.id+'|'+ch.u:'local|'+idx;
  if(ch.c){nrRenderChapter();preloadNext();return}
  const cached=cacheGet(ck);
  if(cached){ch.c=cached;nrRenderChapter();preloadNext();return}
  showNrLoading('正在加载「'+esc(ch.t)+'」…');
  try{
    let text=await novelFetch(ch.u,NR.src.charset,12000,NR.src.via);
    if(NR.src&&NR.src.paged){
      const pm=text.match(/第\s*\(?\s*(\d+)\s*\/?\s*(\d+)\s*\)?\s*页/);
      if(pm&&+pm[2]>1){
        const pages=[parseContent(text,NR.src)];
        for(let pg=2;pg<=+pm[2]&&pg<=6;pg++){
          try{pages.push(parseContent(await novelFetch(ch.u.replace(/\.html$/i,'_'+pg+'.html'),NR.src.charset,12000,NR.src.via),NR.src))}catch(e){}
        }
        ch.c=pages.join('\n');
      }else ch.c=parseContent(text,NR.src);
    }else ch.c=parseContent(text,NR.src);
    if(ch.c.trim().length<20)throw 0;
    cacheSet(ck,ch.c);
    nrRenderChapter();preloadNext();
  }catch(e){
    nrBody().innerHTML='<div class="nr-loading">本章加载失败（免费书源反爬或网络波动）。<br><button class="btn sm" onclick="nrLoadChapter('+NR.cur+')">↻ 重试本章</button> <button class="btn sm ghost" onclick="nrGoChapter(1)">跳到下一章</button></div>';
  }
}
function preloadNext(){
  const ch=NR&&NR.chapters[NR.cur+1];
  if(!ch||ch.c||!NR.src)return;
  const ck=NR.src.id+'|'+ch.u;
  if(cacheGet(ck)){ch.c=cacheGet(ck);return}
  setTimeout(async()=>{
    try{const t=await novelFetch(ch.u,NR.src.charset,12000,NR.src.via);ch.c=parseContent(t,NR.src);cacheSet(ck,ch.c)}catch(e){}
  },500);
}
function nrRenderChapter(){
  const ch=NR.chapters[NR.cur];if(!ch)return;
  const paras=ch.c.split('\n').filter(s=>s.trim());
  nrBody().innerHTML='<div class="nr-ct">'+esc(ch.t)+'</div>'+paras.map(p=>'<p class="nr-para">'+esc(p.trim())+'</p>').join('')+'<div class="nr-end">—— 本章完 ——</div>';
  nrApply();
  if(NR.resumeRatio>0&&!NR._restored){
    requestAnimationFrame(()=>{const b=nrBody();b.scrollTop=NR.resumeRatio*(b.scrollHeight-b.clientHeight);NR.resumeRatio=0;NR._restored=true;updatePos()});
  }
  updatePos();
}
function showNrLoading(msg){nrBody().innerHTML='<div class="nr-loading"><div class="spin"></div>'+msg+'</div>'}
function updateNrTitle(){document.getElementById('nrTitle').textContent=(NR?NR.title:'')+' · '+((NR&&NR.chapters[NR.cur])?NR.chapters[NR.cur].t:'')}
/* ---- 翻页 / 进度 ---- */
function nrNextPage(){const b=nrBody(),h=b.clientHeight*0.85;if(b.scrollTop+h<b.scrollHeight-b.clientHeight-2)b.scrollBy({top:h,behavior:'smooth'});else nrGoChapter(1)}
function nrPrevPage(){const b=nrBody();if(b.scrollTop>4)b.scrollBy({top:-b.clientHeight*0.85,behavior:'smooth'});else nrGoChapter(-1)}
function nrGoChapter(d){
  if(!NR)return;
  const t=NR.cur+d;
  if(t<0){toast('已是第一章');return}
  if(t>=NR.chapters.length){toast('已是最后一章');return}
  NR._restored=false;nrLoadChapter(t);
}
function nrScroll(){
  if(!NR)return;
  clearTimeout(NR._st);
  NR._st=setTimeout(()=>{saveProgress();updatePos()},260);
}
function updatePos(){
  const b=nrBody(),max=b.scrollHeight-b.clientHeight;
  const ratio=max>0?b.scrollTop/max:0;
  const slider=document.getElementById('nrSlider');
  slider.value=Math.round(ratio*1000);
  document.getElementById('nrPos').textContent=(NR?NR.cur+1:0)+'/'+(NR?NR.chapters.length:0)+'章 · '+Math.round(ratio*100)+'%';
}
function saveProgress(){
  if(!NR||!NR.chapters.length)return;
  const b=nrBody(),max=b.scrollHeight-b.clientHeight;
  const ratio=max>0?b.scrollTop/max:0;
  const all=JSON.parse(localStorage.getItem(NL_LS.prog)||'{}');
  all[NR.title]={bi:NR.cur,ratio:Math.round(ratio*100)/100,time:Date.now()};
  try{localStorage.setItem(NL_LS.prog,JSON.stringify(all))}catch(e){}
}
function nrSeek(){
  const b=nrBody(),max=b.scrollHeight-b.clientHeight;
  b.scrollTop=document.getElementById('nrSlider').value/1000*max;
  updatePos();
}
/* ---- 目录 ---- */
function renderToc(){
  const el=document.getElementById('drTocList');
  if(!NR||!NR.chapters.length){el.innerHTML='<div class="empty">暂无目录</div>';return}
  const start=Math.max(0,NR.cur-100),end=Math.min(NR.chapters.length,NR.cur+300);
  el.innerHTML=NR.chapters.slice(start,end).map((c,i)=>{
    const idx=start+i;
    return `<div class="nr-ditem ${idx===NR.cur?'cur':''}" onclick="nrJump(${idx})">${esc(c.t)}</div>`;
  }).join('');
  const cur=el.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});
}
function nrJump(idx){toggleDrawer('toc');if(idx===NR.cur)return;NR._restored=false;nrLoadChapter(idx)}
/* ---- 书签 ---- */
function nrAddMark(){
  if(!NR||!NR.chapters.length){toast('请先打开一本书');return}
  const b=nrBody(),max=b.scrollHeight-b.clientHeight;
  const ratio=max>0?b.scrollTop/max:0;
  const marks=JSON.parse(localStorage.getItem(NL_LS.marks)||'{}');
  if(!marks[NR.title])marks[NR.title]=[];
  marks[NR.title].push({id:uid(),bi:NR.cur,t:NR.chapters[NR.cur].t,ratio:Math.round(ratio*100)/100,time:Date.now()});
  try{localStorage.setItem(NL_LS.marks,JSON.stringify(marks))}catch(e){toast('书签保存失败');return}
  toast('已添加书签 🔖');renderMarks();
}
function renderMarks(){
  const el=document.getElementById('drMarkList');
  const marks=NR?(JSON.parse(localStorage.getItem(NL_LS.marks)||'{}')[NR.title]||[]):[];
  if(!marks.length){el.innerHTML='<div class="empty">暂无书签，阅读时点击右下角 🔖 添加</div>';return}
  el.innerHTML=marks.slice().reverse().map(m=>`<div class="nr-ditem" onclick="gotoMark('${m.id}')">
    <span class="mk-del" onclick="event.stopPropagation();delMark('${m.id}')">🗑</span>${esc(m.t)}
    <div class="mk-sub">${Math.round(m.ratio*100)}% · ${new Date(m.time).toLocaleString()}</div></div>`).join('');
}
function gotoMark(id){
  const marks=JSON.parse(localStorage.getItem(NL_LS.marks)||'{}')[NR.title]||[];
  const m=marks.find(x=>x.id===id);if(!m)return;
  toggleDrawer('mark');
  if(m.bi!==NR.cur){NR._restored=false;NR.resumeRatio=m.ratio;nrLoadChapter(m.bi)}
  else{const b=nrBody();b.scrollTop=m.ratio*(b.scrollHeight-b.clientHeight);updatePos()}
}
function delMark(id){
  const all=JSON.parse(localStorage.getItem(NL_LS.marks)||'{}');
  all[NR.title]=(all[NR.title]||[]).filter(x=>x.id!==id);
  localStorage.setItem(NL_LS.marks,JSON.stringify(all));renderMarks();toast('已删除书签');
}
/* ---- 抽屉 ---- */
function toggleDrawer(name){
  const map={toc:'drToc',mark:'drMark',set:'drSet'};
  const d=document.getElementById(map[name]);
  const willHide=d.classList.contains('hide');
  ['drToc','drMark','drSet'].forEach(id=>document.getElementById(id).classList.add('hide'));
  if(!willHide){d.classList.remove('hide');if(name==='toc')renderToc();if(name==='mark')renderMarks()}
}
/* ---- 阅读设置 ---- */
function nrApply(){
  const g=id=>document.getElementById(id);
  nrPrefs.size=+g('setSize').value;nrPrefs.line=+g('setLine').value/10;nrPrefs.letter=+g('setLetter').value;nrPrefs.width=+g('setWidth').value;nrPrefs.font=g('setFont').value;
  g('lbSize').textContent=nrPrefs.size+'px';
  g('lbLine').textContent=nrPrefs.line.toFixed(1);
  g('lbLetter').textContent=nrPrefs.letter+'px';
  g('lbWidth').textContent=nrPrefs.width+'%';
  const body=nrBody();
  body.style.fontSize=nrPrefs.size+'px';
  body.style.lineHeight=nrPrefs.line;
  body.style.letterSpacing=nrPrefs.letter+'px';
  body.style.maxWidth=nrPrefs.width+'%';
  body.style.margin='0 auto';
  const fm={system:"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif",serif:"'Songti SC','SimSun',serif",kaiti:"'Kaiti SC','KaiTi','STKaiti',serif",heiti:"'PingFang SC','Microsoft YaHei','SimHei',sans-serif",fangsong:"'FangSong','STFangsong',serif",mono:"'Courier New',monospace"};
  body.style.fontFamily=fm[nrPrefs.font]||fm.system;
  body.style.textAlign=nrPrefs.align;
  const ov=document.getElementById('novelReader');
  ov.dataset.bg=nrPrefs.bg;
  ov.style.color=nrPrefs.fg;
  ov.style.background=BG_THEMES.find(t=>t.id===nrPrefs.bg).bg;
  body.style.color=nrPrefs.fg;
  document.querySelectorAll('#setFColor .nr-color').forEach(el=>el.classList.toggle('cur',el.dataset.c===nrPrefs.fg));
  document.querySelectorAll('#setBg .nr-bg').forEach(el=>el.classList.toggle('cur',el.dataset.b===nrPrefs.bg));
  try{localStorage.setItem(NL_LS.prefs,JSON.stringify(nrPrefs))}catch(e){}
}
function setFg(c){nrPrefs.fg=c;nrApply()}
function setBgTheme(b){nrPrefs.bg=b;nrApply()}
function nrToggleTheme(){
  if(nrPrefs.bg==='dark'){nrPrefs.bg='paper';nrPrefs.fg='#1a1a1a'}
  else{nrPrefs.bg='dark';nrPrefs.fg='#b8b8b8'}
  nrApply();
}
function initNrUI(){
  const g=id=>document.getElementById(id);
  g('setFColor').innerHTML=FG_COLORS.map(c=>`<div class="nr-color" style="background:${c}" data-c="${c}" onclick="setFg('${c}')"></div>`).join('');
  g('setBg').innerHTML=BG_THEMES.map(t=>`<div class="nr-bg" style="background:${t.bg}" data-b="${t.id}" onclick="setBgTheme('${t.id}')"><span style="color:${t.fg}">${t.name}</span><i style="background:${t.fg}"></i></div>`).join('');
  g('setSize').value=nrPrefs.size;g('setLine').value=Math.round(nrPrefs.line*10);g('setLetter').value=nrPrefs.letter;g('setWidth').value=nrPrefs.width;g('setFont').value=nrPrefs.font;
  nrApply();
}
/* ---- 事件绑定 ---- */
document.addEventListener('keydown',e=>{
  const ov=document.getElementById('novelReader');
  if(ov.classList.contains('hidden'))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();nrNextPage()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();nrPrevPage()}
  else if(e.key==='Escape'){closeNovelReader()}
});
document.getElementById('nrBody').addEventListener('scroll',nrScroll);
renderSrcBar();
renderNovelLocal();
initNrUI();
</script>
</body>
