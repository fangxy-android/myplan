<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎹 乐器练习系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#2c3e50;min-height:100vh}
.hero{background:linear-gradient(135deg,#ff7675,#2c3e50);color:#fff;padding:26px 22px;position:relative}
.hero h1{font-size:22px;margin-bottom:4px}
.hero p{font-size:12.5px;opacity:.85}
.hero-btns{position:absolute;top:14px;right:16px;display:flex;gap:6px;flex-wrap:wrap}
.hero-btns button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;transition:.2s}
.hero-btns button:hover{background:rgba(255,255,255,.3)}
main{max-width:880px;margin:18px auto 60px;padding:0 16px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stats .st{flex:1;min-width:110px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.stats .st .k{font-size:11px;color:#9aa5b1}
.stats .st .v{font-size:20px;font-weight:800;color:#ff7675;margin-top:2px}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
.toolbar input{flex:1;padding:9px 12px;border:1px solid #dde3ea;border-radius:10px;font-size:13px;outline:none;background:#fff}
.toolbar .add{background:#ff7675;color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:700}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.item{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.05);position:relative;transition:.15s;border-left:4px solid #ff7675}
.item:hover{box-shadow:0 6px 16px rgba(0,0,0,.1)}
.item h4{font-size:14.5px;margin-bottom:6px;color:#2c3e50;padding-right:22px}
.item .meta{font-size:11.5px;color:#9aa5b1;margin:3px 0;line-height:1.7;word-break:break-word}
.item .meta b{color:#5a6b7b}
.item .del{position:absolute;top:10px;right:12px;background:none;border:none;color:#c8cdd6;cursor:pointer;font-size:14px}
.item .del:hover{color:#e74c3c}
.item .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;background:#f0f4f8;color:#5a6b7b;margin:0 5px 4px 0}
.item .done{text-decoration:line-through;opacity:.55}
.item .bar{height:5px;border-radius:4px;background:#eef1f5;margin-top:8px;overflow:hidden}
.item .bar>div{height:100%;border-radius:4px;background:#ff7675}
.empty{grid-column:1/-1;text-align:center;color:#b0b8c4;padding:46px 0;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:430px;max-height:86vh;overflow:auto}
.modal h3{margin-bottom:14px;font-size:16px}
.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-row label{font-size:12px;color:#7f8c9b}
.form-row input,.form-row select,.form-row textarea{padding:8px 10px;border:1px solid #dde3ea;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.form-row textarea{min-height:70px;resize:vertical}
.form-row input[type=checkbox]{width:18px;height:18px;accent-color:#ff7675}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-actions button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px}
.modal-actions .ok{background:#ff7675;color:#fff;font-weight:700}
.modal-actions .no{background:#f0f2f5;color:#5a6b7b}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
body.dark{background:#12181f;color:#d5dce5}
body.dark .stats .st,body.dark .item{background:#1a222c;box-shadow:0 1px 6px rgba(0,0,0,.3)}
body.dark .item h4{color:#e6ecf3}
body.dark .item .meta{color:#8b98a8}
body.dark .item .meta b{color:#b8c4d2}
body.dark .item .tag{background:#27333f;color:#9aa7b8}
body.dark .toolbar input{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .modal{background:#1a222c}
body.dark .form-row input,body.dark .form-row select,body.dark .form-row textarea{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .modal-actions .no{background:#27333f;color:#9aa7b8}
body.dark .item .bar{background:#27333f}
body.dark .empty{color:#5c6a7a}
body.dark .foot{color:#5c6a7a}
.foot{text-align:center;color:#b0b8c4;font-size:11.5px;padding:0 0 24px}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-btns">
    <button onclick="toggleTheme()" id="themeBtn">🌙</button>
    <button onclick="location.href='index.html'">🏠 大厅</button>
    <button onclick="exportData()">📤 导出</button>
    <button onclick="document.getElementById('importFile').click()">📥 导入</button>
    <button onclick="loadExample()">✨ 示例</button>
  </div>
  <h1>🎹 乐器练习系统</h1>
  <p>练习时长、曲目记录、专项统计，一万小时不白练。</p>
</header>
<main>
  <div class="stats" id="statsBar"></div>
  <div class="toolbar">
    <input id="search" placeholder="🔍 搜索…" oninput="renderList()">
    <button class="add" onclick="openModal()">＋ 添加</button>
  </div>
  <div class="list" id="list"></div>
</main>
<div id="modal" class="modal-overlay hidden"><div class="modal">
  <h3 id="modalTitle">添加</h3>
  <div id="modalForm"></div>
  <div class="modal-actions">
    <button class="no" onclick="closeModal()">取消</button>
    <button class="ok" onclick="saveItem()">保存</button>
  </div>
</div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" hidden>
<div class="foot">v2.0 · 数据仅存本地 localStorage · 可导出备份</div>
<script>
const KEY='practice_sys_v1';
const COLOR='#ff7675';
const FIELDS=[{"n": "date", "l": "日期", "t": "date", "o": null, "d": "@TODAY@", "req": true, "placeholder": null}, {"n": "instr", "l": "乐器", "t": "select", "o": ["钢琴", "吉他", "小提琴", "古筝", "架子鼓", "其他"], "d": "钢琴", "req": false, "placeholder": null}, {"n": "mins", "l": "时长(分钟)", "t": "number", "o": null, "d": null, "req": true, "placeholder": null}, {"n": "piece", "l": "练习曲目", "t": "text", "o": null, "d": null, "req": false, "placeholder": null}, {"n": "content", "l": "练习内容", "t": "textarea", "o": null, "d": null, "req": false, "placeholder": null}];
const EXAMPLE=[{"id": "e1", "date": "2026-08-05", "instr": "钢琴", "mins": 45, "piece": "致爱丽丝", "content": "慢练左手"}, {"id": "e2", "date": "2026-08-06", "instr": "钢琴", "mins": 30, "piece": "车尔尼599", "content": "第12条"}, {"id": "e3", "date": "2026-08-07", "instr": "吉他", "mins": 60, "piece": "晴天", "content": "和弦转换"}];
const SEARCH_FIELDS=["piece", "content"];
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items)return s}catch(e){}return {items:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('保存失败：存储空间不足')}}
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
function toggleTheme(){const t=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('theme',t);applyTheme(t)}
applyTheme(localStorage.getItem('theme')||'light');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
let editId=null;
function openModal(id){
  editId=id||null;
  const it=editId?state.items.find(x=>x.id===editId):null;
  document.getElementById('modalTitle').textContent=it?'编辑':'添加';
  document.getElementById('modalForm').innerHTML=FIELDS.map(f=>{
    const v=it?it[f.n]:(f.d==='@TODAY@'?today():(f.d!=null?f.d:(f.t==='checkbox'?false:'')));
    if(f.t==='select')return '<div class="form-row"><label>'+f.l+'</label><select id="f_'+f.n+'">'+f.o.map(o=>'<option'+(String(o)===String(v)?' selected':'')+'>'+o+'</option>').join('')+'</select></div>';
    if(f.t==='textarea')return '<div class="form-row"><label>'+f.l+'</label><textarea id="f_'+f.n+'">'+esc(v)+'</textarea></div>';
    if(f.t==='checkbox')return '<div class="form-row"><label><input type="checkbox" id="f_'+f.n+'"'+(v?' checked':'')+'> '+f.l+'</label></div>';
    return '<div class="form-row"><label>'+f.l+'</label><input type="'+f.t+'" id="f_'+f.n+'" value="'+esc(v)+'"'+(f.t==='number'?' step="any"':'')+(f.placeholder?' placeholder="'+f.placeholder+'"':'')+'></div>';
  }).join('');
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function saveItem(){
  const it={id:editId||uid()};
  FIELDS.forEach(f=>{
    const el=document.getElementById('f_'+f.n);
    if(!el)return;
    if(f.t==='checkbox')it[f.n]=el.checked;
    else if(f.t==='number')it[f.n]=el.value===''?null:Number(el.value);
    else it[f.n]=el.value.trim();
  });
  if(FIELDS.some(f=>f.req&&!it[f.n])){toast('请填写必填项');return}
  if(editId){const i=state.items.findIndex(x=>x.id===editId);if(i>=0)state.items[i]=it}
  else state.items.unshift(it);
  save();closeModal();renderList();renderStats();toast('已保存 ✓');
}
function delItem(id){
  if(!confirm('确定删除这条记录？'))return;
  state.items=state.items.filter(x=>x.id!==id);save();renderList();renderStats();toast('已删除');
}
function renderList(){
  const kw=(document.getElementById('search').value||'').toLowerCase();
  const list=state.items.filter(it=>!kw||SEARCH_FIELDS.some(f=>String(it[f]||'').toLowerCase().includes(kw)));
  document.getElementById('list').innerHTML=list.length?list.map(ITEM_HTML).join(''):'<div class="empty">暂无记录'+(kw?'，换个关键词试试':'，点击「＋ 添加」开始')+'</div>';
}
function renderStats(){
  document.getElementById('statsBar').innerHTML=STATS_FN(state.items).map(s=>'<div class="st"><div class="k">'+s.k+'</div><div class="v">'+s.v+'</div></div>').join('');
}
function exportData(){
  const blob=new Blob(['\ufeff'+JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=KEY+'_'+today()+'.json';a.click();toast('已导出备份 ✓');
}
function importData(){
  const f=document.getElementById('importFile');f.value='';
  f.onchange=()=>{const r=new FileReader();r.onload=e=>{
    try{const d=JSON.parse(e.target.result.replace(/^\ufeff/,''));if(!d.items||!Array.isArray(d.items))throw 0;d.items=d.items.filter(x=>x&&typeof x==='object');d.items.forEach(x=>{if(typeof x.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(x.id))x.id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)});
      state=d;save();renderList();renderStats();toast('导入成功 ✓');
    }catch(err){toast('文件格式不正确')}
  };r.readAsText(f.files[0])};
  f.click();
}
function loadExample(){state={items:JSON.parse(JSON.stringify(EXAMPLE))};save();renderList();renderStats();toast('已载入示例数据 ✨')}
const ITEM_HTML=it=>'<div class="item"><button class="del" onclick="delItem(\''+String(it.id||'').replace(/[^a-zA-Z0-9_-]/g,'')+'\')">✕</button><h4>'+esc(it.instr||'')+'　<b>'+it.mins+' 分钟</b></h4><div class="meta"><b>日期</b> '+esc(it.date)+'</div>'+(it.piece?'<div class="meta"><b>曲目</b> '+esc(it.piece)+'</div>':'')+(it.content?'<div class="meta">'+esc(it.content)+'</div>':'')+'</div>';
const STATS_FN=items=>{const ym=today().slice(0,7);const month=items.filter(x=>(x.date||'').startsWith(ym)).reduce((s,x)=>s+(x.mins||0),0);const now=new Date();const week=items.filter(x=>{const d=new Date(x.date);return now-d<7*864e5}).reduce((s,x)=>s+(x.mins||0),0);const total=items.reduce((s,x)=>s+(x.mins||0),0);return[{k:'本月时长',v:Math.floor(month/60)+'h'+(month%60)+'m'},{k:'本周',v:week+'m'},{k:'总次数',v:items.length},{k:'累计',v:Math.floor(total/60)+'h'+(total%60)+'m'}]};

renderList();renderStats();
</script>
</body>
</html>
