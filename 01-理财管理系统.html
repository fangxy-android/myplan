<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 理财管理系统</title>
<style>
:root{--accent:#16a085;--accent2:#0e6655}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#2c3e50;min-height:100vh}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .logo{font-size:20px;font-weight:700;letter-spacing:1px}
header .actions{display:flex;gap:8px}
header button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
header button:hover{background:rgba(255,255,255,.3)}
.tabs{display:flex;gap:6px;padding:12px 24px 0;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e8ecf1;position:sticky;top:0;z-index:10}
.tabs button{border:none;background:transparent;padding:10px 16px;font-size:14px;color:#6b7686;cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
.tabpane{display:none}
.tabpane.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card .label{font-size:12px;color:#9aa5b1;margin-bottom:6px}
.card .value{font-size:23px;font-weight:700;color:#2c3e50}
.card .sub{font-size:12px;color:#7f8c9b;margin-top:4px}
.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:18px}
.panel h3{font-size:15px;margin-bottom:14px;color:#34495e;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
canvas{width:100%;height:220px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;color:#6b7686;text-align:left;padding:9px 10px;border-bottom:1px solid #e8ecf1;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f4f8}
tr:hover td{background:#fafcff}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.tag.income{background:#e8f8f5;color:#16a085}
.tag.expense{background:#fdecea;color:#c0392b}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:9px;cursor:pointer;font-size:13px;transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#eef1f5;color:#34495e}
.btn.danger{background:#fdecea;color:#c0392b}
.btn.sm{padding:4px 10px;font-size:12px}
.fab{position:fixed;right:28px;bottom:28px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50}
.fab:hover{transform:scale(1.08)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;padding:22px;width:min(480px,92vw);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;color:#2c3e50}
.form-row{margin-bottom:13px}
.form-row label{display:block;font-size:12px;color:#6b7686;margin-bottom:5px;font-weight:600}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 12px;border:1px solid #dde3ea;border-radius:9px;font-size:14px;outline:none;font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,160,133,.12)}
.form-row textarea{resize:vertical;min-height:60px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#toast.show{opacity:1}
.empty{text-align:center;color:#b0b8c4;padding:32px 0;font-size:13px}
.progress{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:7px 10px;border:1px solid #dde3ea;border-radius:8px;font-size:13px;outline:none}
.pos{color:#16a085;font-weight:700}
.neg{color:#c0392b;font-weight:700}
/* ---------- 优化：深色模式 / 打印 / 返回按钮 ---------- */
header .backBtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:8px;text-decoration:none;font-size:13px;transition:.2s}
header .backBtn:hover{background:rgba(255,255,255,.3)}
body.dark{background:#12181f;color:#d5dce5}
body.dark header{box-shadow:0 2px 8px rgba(0,0,0,.4)}
body.dark .tabs{background:#161d26;border-bottom-color:#1f2a36}
body.dark .tabs button{color:#8b98a9}
body.dark .card,body.dark .panel{background:#1a222c;box-shadow:0 1px 4px rgba(0,0,0,.3)}
body.dark .card .value,body.dark .modal h3{color:#e6ecf3}
body.dark .card .label,body.dark .panel h3{color:#9aa7b8}
body.dark th{background:#1e2833;color:#9aa7b8;border-bottom-color:#273242}
body.dark td{border-bottom-color:#202b37}
body.dark tr:hover td{background:#1d2732}
body.dark .btn.ghost{background:#27333f;color:#d5dce5}
body.dark .form-row input,body.dark .form-row select,body.dark .form-row textarea{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .modal{background:#1a222c}
body.dark .modal-overlay{background:rgba(8,12,18,.6)}
body.dark .filters select,body.dark .filters input,body.dark .filters input::placeholder{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .empty{color:#5c6a7a}
body.dark .progress{background:#27333f}
/* ---------- 股票行情 ---------- */
.stock-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;position:relative}
.stock-add input{padding:8px 12px;border:1px solid #dde3ea;border-radius:8px;font-size:13px;flex:1;min-width:200px;outline:none}
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stock-card{background:#f8fafc;border:1px solid #e8ecf1;border-radius:12px;padding:13px 14px;cursor:pointer;transition:.15s;position:relative}
.stock-card:hover{border-color:var(--accent)}
.stock-card.sel{border-color:var(--accent);background:#f0fdfa}
.stock-card .sc-name{font-size:14px;font-weight:700;color:#2c3e50}
.stock-card .sc-code{font-size:11px;color:#9aa5b1;margin:2px 0 8px}
.stock-card .sc-price{font-size:20px;font-weight:700}
.stock-card .sc-chg{font-size:12px;margin-top:2px}
.stock-card .sc-del{position:absolute;top:8px;right:10px;background:none;border:none;color:#b0b8c4;cursor:pointer;font-size:12px}
.stock-card .sc-del:hover{color:#c0392b}
.kline-tools{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.index-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.index-card{flex:1;min-width:150px;background:linear-gradient(135deg,#f8fafc,#eef4f9);border:1px solid #e8ecf1;border-radius:10px;padding:10px 12px}
.index-card .ic-name{font-size:12px;color:#7f8c9b;display:flex;justify-content:space-between;align-items:center}
.index-card .ic-name b{font-weight:700;font-size:13px;color:#2c3e50}
.index-card .ic-val{font-size:18px;font-weight:800;margin:3px 0 1px}
.index-card .ic-chg{font-size:12px;font-weight:600}
.stock-suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;background:#fff;border:1px solid #dde3ea;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:280px;overflow:auto;display:none}
.stock-suggest .ss-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;border-bottom:1px solid #f0f2f5}
.stock-suggest .ss-item:last-child{border-bottom:none}
.stock-suggest .ss-item:hover,.stock-suggest .ss-item.sel{background:#f0fdfa}
.stock-suggest .ss-item .ss-code{color:#9aa5b1;font-size:11px}
.stock-suggest .ss-item .ss-market{font-size:10px;padding:2px 6px;border-radius:4px;background:#eef1f5;color:#7f8c9b}
.quote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.quote-grid .qg{background:#f8fafc;border:1px solid #eef1f5;border-radius:8px;padding:8px 10px}
.quote-grid .qg .qg-k{font-size:11px;color:#9aa5b1}
.quote-grid .qg .qg-v{font-size:14px;font-weight:700;color:#2c3e50;margin-top:2px}
#chartWrap{position:relative}
.kline-hint{position:absolute;top:6px;left:12px;font-size:12px;color:#9aa5b1;pointer-events:none;z-index:2}
body.dark .stock-card{background:#1e2833;border-color:#2a3644}
body.dark .stock-card.sel{background:#14261f;border-color:var(--accent)}
body.dark .stock-card .sc-name{color:#e6ecf3}
body.dark .stock-add input{background:#151c25;border-color:#2a3644;color:#d5dce5}
body.dark .index-card{background:linear-gradient(135deg,#1e2833,#1a2330);border-color:#2a3644}
body.dark .index-card .ic-name{color:#8b98a8}
body.dark .index-card .ic-name b{color:#e6ecf3}
body.dark .stock-suggest{background:#1a2230;border-color:#2a3644}
body.dark .stock-suggest .ss-item{border-color:#232e3d}
body.dark .stock-suggest .ss-item:hover,body.dark .stock-suggest .ss-item.sel{background:#14261f}
body.dark .stock-suggest .ss-item .ss-market{background:#2a3644;color:#9aa5b1}
body.dark .quote-grid .qg{background:#1e2833;border-color:#2a3644}
body.dark .quote-grid .qg .qg-v{color:#e6ecf3}
</style>
</head>
<body>
<header>
  <div class="logo">💰 理财管理系统</div>
  <div class="actions">
    <a href="index.html" class="backBtn">🏠 总览</a>
    <button onclick="toggleTheme()" class="themeBtn">🌙</button>
    <button onclick="loadExample()">✨ 示例</button>
    <button onclick="exportData()">📤 导出</button>
    <button onclick="document.getElementById('file').click()">📥 导入</button>
    <input type="file" id="file" accept=".json" class="hidden" onchange="importData(this)">
  </div>
</header>
<nav class="tabs">
  <button class="active" data-tab="dash" onclick="switchTab('dash')">仪表盘</button>
  <button data-tab="records" onclick="switchTab('records')">收支记录</button>
  <button data-tab="budget" onclick="switchTab('budget')">预算管理</button>
  <button data-tab="cats" onclick="switchTab('cats')">分类管理</button>
  <button data-tab="stocks" onclick="switchTab('stocks')">📈 股票行情</button>
</nav>
<main>
  <section id="tab-dash" class="tabpane active">
    <div class="cards" id="dashCards"></div>
    <div class="grid2">
      <div class="panel"><h3>近 6 个月收支趋势</h3><canvas id="chartTrend"></canvas></div>
      <div class="panel"><h3>本月支出分类占比</h3><canvas id="chartDonut"></canvas></div>
    </div>
    <div class="panel"><h3>最近收支记录</h3><div id="recentList"></div></div>
  </section>
  <section id="tab-records" class="tabpane">
    <div class="panel">
      <div class="filters">
        <select id="fType" onchange="renderRecords()"><option value="">全部类型</option><option value="income">收入</option><option value="expense">支出</option></select>
        <input type="month" id="fMonth" onchange="renderRecords()">
        <select id="fCat" onchange="renderRecords()"><option value="">全部分类</option></select>
        <input type="text" id="fSearch" placeholder="搜索备注…" oninput="renderRecords()" style="flex:1;min-width:140px">
      </div>
      <table id="recTable"></table>
    </div>
  </section>
  <section id="tab-budget" class="tabpane">
    <div class="cards" id="budgetCards"></div>
    <div class="panel"><h3>本月各分类预算执行</h3><div id="budgetList"></div></div>
    <div class="panel"><h3>月度收支汇总</h3><div id="monthSum"></div></div>
  </section>
  <section id="tab-cats" class="tabpane">
    <div class="grid2">
      <div class="panel"><h3>支出分类</h3><div id="catExpense"></div></div>
      <div class="panel"><h3>收入分类</h3><div id="catIncome"></div></div>
    </div>
  </section>
  <section id="tab-stocks" class="tabpane">
    <div id="indexBar" class="index-bar"></div>
    <div class="panel">
      <h3>📈 自选股 · 真实行情</h3>
      <div class="stock-add">
        <input type="text" id="stockCode" placeholder="输入代码 / 名称 / 拼音，如 600519、茅台、mt" onkeydown="if(event.key==='Enter'){if(suggestSel>=0)pickSuggest(suggestSel);else addStock()}" oninput="suggestStock()" autocomplete="off">
        <div id="stockSuggest" class="stock-suggest"></div>
        <button class="btn" onclick="addStock()">＋ 添加自选</button>
        <button class="btn ghost" onclick="loadIndex();loadStocks()">🔄 刷新行情</button>
        <span style="font-size:12px;color:#9aa5b1">数据：东方财富 · 每 30 秒自动刷新</span>
      </div>
      <div id="stockList" class="stock-grid"></div>
    </div>
    <div class="panel" id="stockDetail" style="display:none">
      <h3 id="stockDetailTitle"></h3>
      <div class="kline-tools">
        <button class="btn sm ghost kline-btn" data-p="trend" onclick="setKlinePeriod('trend')">📉 分时</button>
        <button class="btn sm ghost kline-btn active" data-p="day" onclick="setKlinePeriod('day')">日K</button>
        <button class="btn sm ghost kline-btn" data-p="week" onclick="setKlinePeriod('week')">周K</button>
        <button class="btn sm ghost kline-btn" data-p="month" onclick="setKlinePeriod('month')">月K</button>
        <span id="klineLoading" style="font-size:12px;color:#9aa5b1;margin-left:auto"></span>
      </div>
      <div id="chartWrap">
        <canvas id="chartStock"></canvas>
        <div class="kline-hint" id="klineHint"></div>
      </div>
      <div id="stockQuoteBar"></div>
    </div>
  </section>
</main>
<button class="fab" onclick="openRecord()">＋</button>

<div id="modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modalTitle">添加收支</h3>
    <div class="form-row"><label>类型</label>
      <select id="mType" onchange="fillCatSelect()"><option value="expense">支出</option><option value="income">收入</option></select></div>
    <div class="form-row"><label>金额（元）</label><input type="number" id="mAmount" min="0" step="0.01" placeholder="0.00"></div>
    <div class="form-row"><label>分类</label><select id="mCat"></select></div>
    <div class="form-row"><label>日期</label><input type="date" id="mDate"></div>
    <div class="form-row"><label>备注</label><input type="text" id="mNote" placeholder="可选"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const LS_KEY='money_sys_v1';
const DEF_CATS=[
 {id:'c1',name:'餐饮',type:'expense',icon:'🍜'},{id:'c2',name:'交通',type:'expense',icon:'🚌'},
 {id:'c3',name:'购物',type:'expense',icon:'🛍️'},{id:'c4',name:'娱乐',type:'expense',icon:'🎮'},
 {id:'c5',name:'居住',type:'expense',icon:'🏠'},{id:'c6',name:'医疗',type:'expense',icon:'💊'},
 {id:'c7',name:'教育',type:'expense',icon:'📚'},{id:'c8',name:'人情',type:'expense',icon:'🎁'},
 {id:'c9',name:'其他',type:'expense',icon:'📦'},
 {id:'i1',name:'工资',type:'income',icon:'💼'},{id:'i2',name:'奖金',type:'income',icon:'🎉'},
 {id:'i3',name:'理财',type:'income',icon:'📈'},{id:'i4',name:'其他',type:'income',icon:'💰'}
];
let state=load();
function defaults(){return{records:[],cats:JSON.parse(JSON.stringify(DEF_CATS)),budgets:{},totalBudget:0,stocks:JSON.parse(JSON.stringify(DEF_STOCKS))}}
const DEF_STOCKS=[{id:'s1',code:'600519',name:'贵州茅台'},{id:'s2',code:'300750',name:'宁德时代'},{id:'s3',code:'601318',name:'中国平安'},{id:'s4',code:'000858',name:'五粮液'},{id:'s5',code:'000001',name:'平安银行'},{id:'s6',code:'600036',name:'招商银行'},{id:'s7',code:'000333',name:'美的集团'},{id:'s8',code:'601899',name:'紫金矿业'}];
function load(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.cats){if(!s.stocks)s.stocks=JSON.parse(JSON.stringify(DEF_STOCKS));return s}}catch(e){}return defaults()}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(state))}
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');document.querySelectorAll('.themeBtn').forEach(b=>b.textContent=t==='dark'?'☀️':'🌙')}
function toggleTheme(){const t=document.body.classList.contains('dark')?'light':'dark';localStorage.setItem('theme',t);applyTheme(t)}
applyTheme(localStorage.getItem('theme')||'light');
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function curMonth(){return todayStr().slice(0,7)}
function money(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function catById(id){return state.cats.find(c=>c.id===id)}
function catsByType(t){return state.cats.filter(c=>c.type===t)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function switchTab(name){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));if(name==='dash')renderDash();if(name==='records')renderRecords();if(name==='budget')renderBudget();if(name==='cats')renderCats();if(name==='stocks'){loadIndex();loadStocks();if(!currentStock&&state.stocks.length)showStock(state.stocks[0].id)}}

/* ---------- 图表 ---------- */
function setupCanvas(cv){const dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);return{ctx,w:r.width,h:r.height}}
function drawLine(cv,labels,series){
  const{ctx,w,h}=setupCanvas(cv);const pad={l:44,r:14,t:16,b:26};
  let max=1,min=0;series.forEach(s=>s.values.forEach(v=>{max=Math.max(max,v);min=Math.min(min,v)}));max*=1.15;
  ctx.strokeStyle='#eceff4';ctx.fillStyle='#9aa5b1';ctx.font='11px sans-serif';ctx.textAlign='left';
  for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(String(Math.round(max-(max-min)*i/4)),2,y+4)}
  const step=(w-pad.l-pad.r)/Math.max(1,labels.length-1);
  series.forEach(s=>{ctx.beginPath();s.values.forEach((v,i)=>{const x=pad.l+step*i,y=pad.t+(h-pad.t-pad.b)*(1-(v-min)/(max-min||1));i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=s.color;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
    s.values.forEach((v,i)=>{const x=pad.l+step*i,y=pad.t+(h-pad.t-pad.b)*(1-(v-min)/(max-min||1));ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill()})});
  ctx.fillStyle='#9aa5b1';ctx.textAlign='center';const every=Math.max(1,Math.ceil(labels.length/8));
  labels.forEach((lb,i)=>{if(i%every===0||i===labels.length-1)ctx.fillText(lb,pad.l+step*i,h-8)});
  let lx=w-120;series.forEach(s=>{ctx.fillStyle=s.color;ctx.fillRect(lx,8,10,10);ctx.fillStyle='#7f8c9b';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText(s.name,lx+14,17);lx+=14+ctx.measureText(s.name).width+12})
}
function drawBar(cv,labels,values,color){
  const{ctx,w,h}=setupCanvas(cv);const pad={l:44,r:14,t:16,b:26};
  const max=Math.max(...values,1)*1.15;
  ctx.strokeStyle='#eceff4';ctx.fillStyle='#9aa5b1';ctx.font='11px sans-serif';ctx.textAlign='left';
  for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(String(Math.round(max*(4-i)/4)),2,y+4)}
  const bw=(w-pad.l-pad.r)/labels.length;const barW=Math.min(34,bw*0.55);
  values.forEach((v,i)=>{const x=pad.l+bw*i+bw/2-barW/2;const bh=(h-pad.t-pad.b)*v/max;ctx.fillStyle=color;ctx.roundRect(x,h-pad.b-bh,barW,bh,5);ctx.fill()});
  ctx.fillStyle='#9aa5b1';ctx.textAlign='center';const every=Math.max(1,Math.ceil(labels.length/10));
  labels.forEach((lb,i)=>{if(i%every===0||i===labels.length-1)ctx.fillText(lb,pad.l+bw*i+bw/2,h-8)});
}
function drawDonut(cv,items){
  const{ctx,w,h}=setupCanvas(cv);const total=items.reduce((s,i)=>s+i.value,0);
  if(total<=0){ctx.fillStyle='#b0b8c4';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无数据',w/2,h/2);return}
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-26,r=R*0.62;let a=-Math.PI/2;
  const palette=['#16a085','#3498db','#e74c3c','#f39c12','#8e44ad','#1abc9c','#e67e22','#2c3e50','#c0392b','#7f8c8d','#27ae60','#9b59b6'];
  items.forEach((it,i)=>{const ang=it.value/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+ang);ctx.closePath();ctx.fillStyle=palette[i%palette.length];ctx.fill();a+=ang});
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#2c3e50';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText(total.toFixed(0)+' 元',cx,cy-2);
  ctx.fillStyle='#9aa5b1';ctx.font='11px sans-serif';ctx.fillText('本月支出',cx,cy+16);
  let ly=6;ctx.textAlign='left';ctx.font='11px sans-serif';
  items.slice(0,6).forEach((it,i)=>{ctx.fillStyle=palette[i%palette.length];ctx.fillRect(w-140,ly,10,10);ctx.fillStyle='#5d6d7e';ctx.fillText(it.name+' '+(it.value/total*100).toFixed(1)+'%',w-126,ly+9);ly+=16});
}

function loadStocks(){
  const box=document.getElementById('stockList');
  if(!state.stocks.length){box.innerHTML='<div class="empty">还没有自选股，输入代码 / 名称 / 拼音添加（如 600519、茅台、mt）</div>';return}
  box.innerHTML=state.stocks.map(s=>'<div class="stock-card'+(currentStock===s.id?' sel':'')+'" data-id="'+s.id+'" onclick="showStock(\''+s.id+'\')">'
    +'<button class="sc-del" onclick="event.stopPropagation();delStock(\''+s.id+'\')">✕</button>'
    +'<div class="sc-name">'+(s.name||s.code)+'</div>'
    +'<div class="sc-code">'+s.code+'</div>'
    +'<div class="sc-price">--</div>'
    +'<div class="sc-chg">加载中…</div>'
    +'</div>').join('');
  state.stocks.forEach(s=>{
    const secid=secidOf(s.code);if(!secid)return;
    fetchJSON(emQuoteUrl(secid)).then(d=>{
      const q=d&&d.data;if(!q||!q.f58)return;
      s.name=q.f58;save();
      const card=document.querySelector('.stock-card[data-id="'+s.id+'"]');if(!card)return;
      const up=q.f170>=0,c=up?'#e74c3c':'#16a085';
      card.querySelector('.sc-price').textContent=q.f43!=null?Number(q.f43).toFixed(2):'--';
      card.querySelector('.sc-price').style.color=c;
      card.querySelector('.sc-chg').innerHTML='<span style="color:'+c+'">'+(up?'+':'')+(q.f169||0).toFixed(2)+' '+(up?'+':'')+(q.f170||0).toFixed(2)+'%</span>';
      if(currentStock===s.id)updateQuote(q);
    }).catch(()=>{const card=document.querySelector('.stock-card[data-id="'+s.id+'"]');if(card)card.querySelector('.sc-chg').textContent='获取失败'});
  });
}
function addStock(){
  const code=document.getElementById('stockCode').value.trim();
  if(!code){toast('请输入股票代码或名称');return}
  if(/^\d{6}$/.test(code))addStockCode(code);
  else toast('请输入 6 位代码，或在下方选择联想结果');
}
function addStockCode(code,name){
  if(!secidOf(code)){toast('代码格式不正确');return}
  if(state.stocks.some(s=>s.code===code)){toast('该股票已在自选股中');return}
  fetchJSON(emQuoteUrl(secidOf(code))).then(d=>{
    const q=d&&d.data;
    if(!q||!q.f58){toast('未找到该股票，请检查代码');return}
    state.stocks.push({id:uid(),code,name:q.f58});save();
    document.getElementById('stockCode').value='';
    loadStocks();showStock(state.stocks[state.stocks.length-1].id);
    toast('已添加 '+q.f58+' ✓');
  }).catch(()=>toast('获取股票信息失败，请检查网络'));
}
function delStock(id){
  if(!confirm('从自选股中移除？'))return;
  state.stocks=state.stocks.filter(s=>s.id!==id);save();
  if(currentStock===id){currentStock=null;document.getElementById('stockDetail').style.display='none'}
  loadStocks();toast('已移除');
}
function setKlinePeriod(p){klinePeriod=p;document.querySelectorAll('.kline-btn').forEach(b=>b.classList.toggle('active',b.dataset.p===p));if(currentStock)showStock(currentStock)}
async function showStock(id){
  currentStock=id;
  document.querySelectorAll('.stock-card').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
  const s=state.stocks.find(x=>x.id===id);if(!s)return;
  document.getElementById('stockDetail').style.display='block';
  document.getElementById('stockDetailTitle').textContent=(s.name||s.code)+'（'+s.code+'）';
  const loading=document.getElementById('klineLoading');loading.textContent='加载中…';
  const secid=secidOf(s.code);if(!secid){loading.textContent='代码无效';return}
  const q=stockQuotes[s.id];if(q)updateQuote(q);
  if(klinePeriod==='trend'){await loadTrend(s,secid);return}
  const klt=klinePeriod==='week'?102:klinePeriod==='month'?103:101;
  const lmt=klinePeriod==='day'?90:klinePeriod==='week'?80:60;
  try{
    const d=await fetchJSON(EM_KLINE+'&klt='+klt+'&lmt='+lmt+secid);
    let rows=(d.data&&d.data.klines||[]).map(r=>{const p=r.split(',');return{date:p[0],open:+p[1],close:+p[2],high:+p[3],low:+p[4],vol:+p[5],amt:+p[6]||0}});
    if(!rows.length)rows=await txKline(s.code,klt,lmt);
    if(!rows.length){loading.textContent='暂无K线数据';return}
    drawCandles(rows);
    const label=klinePeriod==='day'?'日K':klinePeriod==='week'?'周K':'月K';
    loading.textContent=label+' · 最近 '+rows.length+' 个周期 · 前复权';
    if(q)updateQuote(q);
  }catch(e){
    loading.textContent='东财K线失败，尝试腾讯备用…';
    try{
      const rows=await txKline(s.code,klt,lmt);
      if(!rows.length){loading.textContent='暂无K线数据';return}
      drawCandles(rows);loading.textContent='腾讯K线 · 最近 '+rows.length+' 个周期';
      if(q)updateQuote(q);
    }catch(e2){loading.textContent='走势图获取失败，请稍后重试'}
  }
}
async function txKline(code,klt,lmt){
  const map={101:'day',102:'week',103:'month'};
  const prefix=code.startsWith('6')?'sh':'sz';
  const r=await fetch(TX_KLINE+prefix+code+','+map[klt]+',,,,'+lmt+',qfq');
  if(!r.ok)throw 0;
  const j=await r.json();
  const d=(j.data&&j.data[prefix+code])||{};
  const key=d['qfq'+map[klt]]||d[map[klt]]||[];
  return key.map(p=>({date:p[0],open:+p[1],close:+p[2],high:+p[3],low:+p[4],vol:+p[5],amt:0}));
}
async function loadTrend(s,secid){
  const loading=document.getElementById('klineLoading');loading.textContent='加载分时…';
  try{
    const d=await fetchJSON(EM_TREND+secid);
    const td=d.data;
    const preClose=td.preClose;
    const rows=(td.trends||[]).map(r=>{const p=r.split(',');return{t:p[1],price:+p[2],avg:+p[7],vol:+p[5],amt:+p[6]}});
    if(!rows.length)throw 0;
    drawTrend(rows,preClose);loading.textContent='分时 · '+rows.length+' 分钟 · 昨收 '+preClose;
    const q=stockQuotes[s.id];if(q)updateQuote(q);
  }catch(e){
    loading.textContent='东财分时失败，尝试腾讯备用…';
    try{
      const rows=await txTrend(s.code);
      if(!rows.length)throw 0;
      const pre=stockQuotes[s.id]?stockQuotes[s.id].f60:0;
      drawTrend(rows,pre);loading.textContent='分时（腾讯备用）· 昨收 '+pre;
      const q=stockQuotes[s.id];if(q)updateQuote(q);
    }catch(e2){loading.textContent='分时获取失败，请稍后重试'}
  }
}
async function txTrend(code){
  const prefix=code.startsWith('6')?'sh':'sz';
  const r=await fetch(TX_TREND+prefix+code);
  if(!r.ok)throw 0;
  const j=await r.json();
  const d=j.data&&j.data[prefix+code];
  const arr=(d&&d.data&&d.data.data)||[];
  let cumAmt=0,cumVol=0;
  return arr.map(s=>{
    const p=s.split(' ');
    const t=p[0],price=+p[1],vol=+p[2],amt=+p[3];
    cumAmt+=amt;cumVol+=vol;
    return{t:t.slice(0,2)+':'+t.slice(2),price,avg:cumVol?cumAmt/cumVol/100:price,vol,amt};
  });
}
function updateQuote(q){
  if(!q)return;
  if(currentStock)stockQuotes[currentStock]=q;
  const el=document.getElementById('stockQuoteBar');
  const up=q.f170>=0,c=up?'#e74c3c':'#16a085';
  const head='<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span style="font-size:30px;font-weight:800;color:'+c+'">'+(q.f43!=null?Number(q.f43).toFixed(2):'--')+'</span><span style="font-size:16px;font-weight:700;color:'+c+'">'+(up?'+':'')+(q.f169||0).toFixed(2)+'　'+(up?'+':'')+(q.f170||0).toFixed(2)+'%</span><span style="font-size:12px;color:#9aa5b1">'+(q.f170>=0?'📈 上涨':'📉 下跌')+'</span></div>';
  const items=[
    ['今开',q.f46!=null?Number(q.f46).toFixed(2):null],['昨收',q.f60!=null?Number(q.f60).toFixed(2):null],
    ['最高',q.f44!=null?Number(q.f44).toFixed(2):null],['最低',q.f45!=null?Number(q.f45).toFixed(2):null],
    ['成交量',fmtVol(q.f47)],['成交额',fmtAmt(q.f48)],
    ['换手率',q.f168!=null?q.f168.toFixed(2)+'%':null],['量比',q.f50!=null?q.f50.toFixed(2):null],
    ['市盈率(TTM)',q.f164!=null?q.f164.toFixed(2):null],['振幅',q.f171!=null?q.f171.toFixed(2)+'%':null],
    ['总市值',fmtAmt(q.f116)],['流通市值',fmtAmt(q.f117)]
  ];
  el.innerHTML=head+'<div class="quote-grid">'+items.map(x=>'<div class="qg"><div class="qg-k">'+x[0]+'</div><div class="qg-v">'+(x[1]==null?'--':x[1])+'</div></div>').join('')+'</div>';
}
function drawCandles(rows){
  const cv=document.getElementById('chartStock');const{ctx,w,h}=setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const pad={l:48,r:12,t:26,b:24};const mainH=(h-pad.t-pad.b)*0.72;const gap=12;const volH=(h-pad.t-pad.b)-mainH-gap;
  let max=Math.max.apply(null,rows.map(r=>r.high)),min=Math.min.apply(null,rows.map(r=>r.low));
  const padV=(max-min)*0.05||1;max+=padV;min-=padV;
  const n=rows.length,cw=(w-pad.l-pad.r)/n;
  const yOf=v=>pad.t+(max-v)/(max-min)*mainH;
  const maxVol=Math.max.apply(null,rows.map(r=>r.vol))||1,vBottom=pad.t+mainH+gap+volH;
  const px={pad,mainH,volH,max,min,maxVol,vBottom,cw,n,yOf};
  drawCandlesBase(rows,ctx,w,h,px);
  bindCrosshair(rows,cv,ctx,w,h,px);
}
function drawCandlesBase(rows,ctx,w,h,px){
  const{pad,mainH,volH,max,min,maxVol,vBottom,cw,n,yOf}=px;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#eceff4';ctx.fillStyle='#9aa5b1';ctx.font='11px sans-serif';ctx.textAlign='left';
  for(let i=0;i<=4;i++){const y=pad.t+mainH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText((max-(max-min)*i/4).toFixed(2),2,y+4)}
  rows.forEach((r,i)=>{
    const x=pad.l+cw*i+cw/2,up=r.close>=r.open,c=up?'#e74c3c':'#16a085';
    const bw=Math.max(2,cw*0.6);
    ctx.strokeStyle=c;ctx.fillStyle=c;
    ctx.beginPath();ctx.moveTo(x,yOf(r.high));ctx.lineTo(x,yOf(r.low));ctx.stroke();
    ctx.fillRect(x-bw/2,Math.min(yOf(r.open),yOf(r.close)),bw,Math.max(1.5,Math.abs(yOf(r.open)-yOf(r.close))));
    const vh=volH*(r.vol/maxVol);ctx.fillStyle=c;ctx.globalAlpha=.55;ctx.fillRect(x-bw/2,vBottom-vh,bw,vh);ctx.globalAlpha=1;
    if(i%Math.ceil(n/6)===0){ctx.fillStyle='#9aa5b1';ctx.textAlign='center';ctx.fillText(r.date.slice(5),x,h-pad.b+14);ctx.textAlign='left'}
  });
  [[5,'#f39c12'],[10,'#3498db'],[20,'#9b59b6']].forEach(([p,c])=>{
    ctx.strokeStyle=c;ctx.lineWidth=1;ctx.beginPath();let started=false;
    rows.forEach((r,i)=>{
      if(i<p-1)return;
      let v=0;for(let j=i-p+1;j<=i;j++)v+=rows[j].close;v/=p;
      const x=pad.l+cw*i+cw/2,y=yOf(v);
      if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
  const last=rows[n-1];
  ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillStyle=last.close>=last.open?'#e74c3c':'#16a085';
  ctx.fillText('收 '+(last.close||0).toFixed(2),pad.l,pad.t-8);
  let lx=pad.l+58;
  [[5,'#f39c12'],[10,'#3498db'],[20,'#9b59b6']].forEach(([p,c])=>{
    let v=0;for(let j=n-p;j<n;j++)v+=rows[j].close;v/=p;
    ctx.fillStyle=c;ctx.fillText('MA'+p+' '+v.toFixed(2),lx,pad.t-8);lx+=76;
  });
  ctx.lineWidth=1;
}
function bindCrosshair(rows,cv,ctx,w,h,px){
  const{pad,cw,n,vBottom,yOf}=px;
  cv.onmousemove=null;cv.onmouseleave=null;
  let cur=-1;
  cv.onmousemove=e=>{
    const rect=cv.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const i=Math.min(n-1,Math.max(0,Math.round((mx-pad.l)/cw-0.5)));
    if(i===cur)return;cur=i;
    drawCandlesBase(rows,ctx,w,h,px);
    const r=rows[i],x=pad.l+cw*i+cw/2;
    ctx.strokeStyle='#b8c0cc';ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,vBottom);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad.l,my);ctx.lineTo(w-pad.r,my);ctx.stroke();ctx.setLineDash([]);
    const up=r.close>=r.open,c=up?'#e74c3c':'#16a085';
    const hint=document.getElementById('klineHint');
    if(hint)hint.innerHTML='<b>'+r.date+'</b>　开 '+r.open.toFixed(2)+'　收 <b style="color:'+c+'">'+r.close.toFixed(2)+'</b>　高 <span style="color:#e74c3c">'+r.high.toFixed(2)+'</span>　低 <span style="color:#16a085">'+r.low.toFixed(2)+'</span>　量 '+fmtVol(r.vol);
  };
  cv.onmouseleave=()=>{cur=-1;const hint=document.getElementById('klineHint');if(hint)hint.innerHTML=''};
}
function drawTrend(rows,preClose){
  const cv=document.getElementById('chartStock');const{ctx,w,h}=setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const pad={l:48,r:12,t:26,b:24};const mainH=(h-pad.t-pad.b)*0.72;const gap=12;const volH=(h-pad.t-pad.b)-mainH-gap;
  let max=Math.max.apply(null,rows.map(r=>r.price)),min=Math.min.apply(null,rows.map(r=>r.price));
  rows.forEach(r=>{max=Math.max(max,r.avg);min=Math.min(min,r.avg)});
  if(preClose){const pv=Math.max(Math.abs(max-preClose),Math.abs(min-preClose),preClose*0.01);max=preClose+pv;min=preClose-pv}
  else{const padV=(max-min)*0.05||1;max+=padV;min-=padV}
  const n=rows.length,cw=(w-pad.l-pad.r)/n;
  const yOf=v=>pad.t+(max-v)/(max-min)*mainH;
  const vBottom=pad.t+mainH+gap+volH;
  ctx.strokeStyle='#eceff4';ctx.fillStyle='#9aa5b1';ctx.font='11px sans-serif';ctx.textAlign='left';
  for(let i=0;i<=4;i++){const y=pad.t+mainH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText((max-(max-min)*i/4).toFixed(2),2,y+4)}
  if(preClose){ctx.strokeStyle='#c8cdd6';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,yOf(preClose));ctx.lineTo(w-pad.r,yOf(preClose));ctx.stroke();ctx.setLineDash([])}
  const maxVol=Math.max.apply(null,rows.map(r=>r.vol))||1;
  rows.forEach((r,i)=>{
    const x=pad.l+cw*i+cw/2;
    const up=r.price>=preClose,c=up?'#e74c3c':'#16a085';
    const vh=volH*(r.vol/maxVol);
    ctx.fillStyle=c;ctx.globalAlpha=.5;ctx.fillRect(x-cw*0.3,vBottom-vh,cw*0.6,vh);ctx.globalAlpha=1;
  });
  ctx.strokeStyle='#e74c3c';ctx.lineWidth=1.2;ctx.beginPath();
  rows.forEach((r,i)=>{const x=pad.l+cw*i+cw/2,y=yOf(r.price);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.stroke();
  ctx.strokeStyle='#f1c40f';ctx.lineWidth=1;ctx.beginPath();
  rows.forEach((r,i)=>{const x=pad.l+cw*i+cw/2,y=yOf(r.avg);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.stroke();
  ctx.lineWidth=1;
  ctx.fillStyle='#9aa5b1';ctx.textAlign='center';
  const marks=['09:30','10:30','11:30/13:00','14:00','15:00'];
  marks.forEach((m,i)=>{const x=pad.l+(w-pad.l-pad.r)*i/(marks.length-1);ctx.fillText(m,x,h-pad.b+14)});
  if(preClose){ctx.textAlign='left';ctx.fillStyle='#c8cdd6';ctx.fillText('昨收 '+preClose.toFixed(2),w-pad.r-80,pad.t-8)}
}
/* ---- 30 秒自动刷新（仅股票页激活时） ---- */
setInterval(()=>{
  const act=document.querySelector('.tabs button.active');
  if(act&&act.dataset.tab==='stocks'){loadIndex();loadStocks()}
},30000);
document.addEventListener('click',e=>{
  if(!e.target.closest('.stock-add'))hideSuggest();
});
document.addEventListener('keydown',e=>{
  const sg=document.getElementById('stockSuggest');
  if(!sg||sg.style.display==='none')return;
  const items=sg.querySelectorAll('.ss-item');
  if(e.key==='ArrowDown'){e.preventDefault();suggestSel=Math.min(suggestSel+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('sel',i===suggestSel))}
  else if(e.key==='ArrowUp'){e.preventDefault();suggestSel=Math.max(suggestSel-1,0);items.forEach((el,i)=>el.classList.toggle('sel',i===suggestSel))}
});
renderAll();
